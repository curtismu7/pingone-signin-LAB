# OrbStack:  HOST_PORT=6171 docker compose up --build -d   ->  http://127.0.0.1:6171
# The server binds 0.0.0.0 INSIDE the container (SIGNIN_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 6100-6199.
name: pingone-signin-lab

services:
  pingone-signin-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-6171}:6171"
    environment:
      SHELF_URL: ${SHELF_URL:-}
      PORT: "6171"
      SIGNIN_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6171/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
